# Static site — no build step. Serve the repository root as-is.
[build]
  publish = "."

# HTML must always revalidate — this was already Netlify's implicit default
# (confirmed live: max-age=0, must-revalidate), made explicit here so stale
# titles/content after a deploy are never a server-caching question again.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

# Long-cache the immutable media/runtime; HTML stays fresh.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
